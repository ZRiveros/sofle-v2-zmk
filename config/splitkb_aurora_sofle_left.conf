# Central side (left) config
# Logging removed — was causing input processing lag

# Stronger signal = fewer retransmits; matches the right half so the
# link budget is symmetric
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Custom OLED status screen (src/display/): dual battery "L: x%  R: y%"
# on top, output status + active layer below. Ported from the brain
# keyboard (Dreeoo/zmk-config).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# Fetch the right half's battery level — consumed by the dual-battery
# widget above. (PROXY to the host stays off: tested 2026-08-27, Windows
# does not display a second battery for one device.)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Dedicated display thread so rendering never blocks the system
# workqueue (proven trio from the brain keyboard, same display)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=14
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
