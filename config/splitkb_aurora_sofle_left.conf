# Central side (left) config
# Logging removed — was causing input processing lag

# Custom OLED status screen (src/display/): "L: x%  R: y%" on top,
# output status + active layer below. Same code and LVGL settings as
# Dreeoo/zmk-config (brain keyboard), which runs on the same OLED.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# ZMK only sizes LVGL's heap (and picks the mono theme) for its built-in
# screen. A custom screen falls back to Zephyr's 2048-byte pool, which is
# too small: LVGL can't allocate the screen, nothing is drawn and the
# OLED shows uninitialized pixel noise. That's what the August 2026
# attempt did.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_VDB_SIZE=100

# Dedicated display thread so rendering never blocks the system workqueue
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=14
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Fetch the right half's battery level for the "R:" readout
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
