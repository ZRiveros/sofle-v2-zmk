# Central side (left) config
# Logging removed — was causing input processing lag

# Stronger signal = fewer retransmits; matches the right half so the
# link budget is symmetric
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fetch the right half's battery level and proxy it to the host as a
# second battery service, so silent peripheral drain is visible before
# it kills the split link (no stock OLED widget for it — host-side only)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
