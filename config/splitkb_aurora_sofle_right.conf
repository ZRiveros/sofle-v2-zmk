# Touchpad driver (right/peripheral side)
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y

# No physical display on right side
CONFIG_ZMK_DISPLAY=n

# Split peripheral never sends USB HID — drop the USB stack. Less bus
# activity/noise exactly when USB-C is plugged in (charging), which is
# when touchpad glitching occurred. Charging and UF2 flashing unaffected.
CONFIG_ZMK_USB=n

# Report battery level to the central so the left OLED can show it
CONFIG_ZMK_BATTERY_REPORTING=y

# Faster BLE connection interval for lower mouse latency (7.5ms min)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6

# BLE optimizations — stronger signal = fewer retransmits
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Stack sizes — I2C polling needs headroom
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=4096
